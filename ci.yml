name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run the full suite (incl. slow/integration tests) nightly.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  fast-tests:
    name: Fast unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run fast test suite (excludes @pytest.mark.slow)
        run: |
          pytest -q -m "not slow" --cov=lytimet --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  slow-tests:
    name: Slow / integration tests
    runs-on: ubuntu-latest
    # Slow tests run real (tiny) training loops, so keep them off the
    # per-push critical path: nightly schedule, manual dispatch, or when a
    # PR is explicitly labeled "run-slow-tests".
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-slow-tests')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run full test suite (including @pytest.mark.slow)
        run: |
          pytest -q --cov=lytimet --cov-report=term-missing
