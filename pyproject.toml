[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-lytimet"
version = "0.1.0"
description = "JAX/Equinox/Optax implementation of LyTimeT (state-variable discovery via TimeSformer encoding + latent dynamics + Lyapunov regularization)"
requires-python = ">=3.10"
readme = "jax_lytimet/README.md"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11",
    "optax>=0.2",
    "einops>=0.7",
    "jaxtyping>=0.2",
    "diffrax>=0.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["jax_lytimet*"]

[tool.coverage.run]
source = ["jax_lytimet"]
omit = [
    "jax_lytimet/demo*.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end / training smoke tests that take longer to run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
